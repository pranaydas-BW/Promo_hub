<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Broadway — Internal Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #F7F5F0;
    --surface: #FFFFFF;
    --border: #E4E0D8;
    --border-hover: #C8C2B4;
    --text: #1A1916;
    --text-muted: #7A766C;
    --text-faint: #B0AC9F;
    --accent: #2D5A3D;
    --accent-light: #EBF2ED;
    --accent-text: #1E3D29;
    --tag-bg: #EFEDE8;
    --tag-text: #5A5650;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0;
  }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 2.5rem;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-mark {
    width: 32px;
    height: 32px;
    background: var(--accent);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: -0.5px;
  }

  .logo-name {
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
    letter-spacing: -0.2px;
  }

  .logo-divider {
    width: 1px;
    height: 16px;
    background: var(--border);
  }

  .logo-sub {
    font-size: 13px;
    color: var(--text-muted);
  }

  .header-right {
    font-size: 12px;
    color: var(--text-faint);
    font-family: 'DM Mono', monospace;
  }

  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 3rem 2rem;
  }

  .page-title {
    font-size: 28px;
    font-weight: 300;
    letter-spacing: -0.5px;
    color: var(--text);
    margin-bottom: 6px;
  }

  .page-sub {
    font-size: 14px;
    color: var(--text-muted);
    margin-bottom: 2.5rem;
  }

  .section {
    margin-bottom: 2.5rem;
  }

  .section-label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin-bottom: 12px;
    padding-left: 2px;
  }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 12px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem;
    text-decoration: none;
    display: block;
    transition: border-color 0.15s, transform 0.1s;
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--accent);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.2s;
  }

  .card:hover {
    border-color: var(--border-hover);
    transform: translateY(-1px);
  }

  .card:hover::before {
    transform: scaleX(1);
  }

  .card-icon {
    width: 38px;
    height: 38px;
    background: var(--accent-light);
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent);
    font-size: 18px;
    margin-bottom: 14px;
  }

  .card-name {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 5px;
    letter-spacing: -0.1px;
  }

  .card-desc {
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.6;
    margin-bottom: 14px;
  }

  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .card-tag {
    font-size: 11px;
    background: var(--tag-bg);
    color: var(--tag-text);
    padding: 3px 8px;
    border-radius: 4px;
    font-weight: 400;
  }

  .card-arrow {
    font-size: 13px;
    color: var(--text-faint);
    transition: color 0.15s;
  }

  .card:hover .card-arrow {
    color: var(--accent);
  }

  .empty-state {
    text-align: center;
    padding: 4rem 2rem;
    color: var(--text-faint);
    font-size: 14px;
  }

  .empty-state i {
    font-size: 32px;
    display: block;
    margin-bottom: 12px;
    opacity: 0.4;
  }

  footer {
    text-align: center;
    padding: 2rem;
    font-size: 12px;
    color: var(--text-faint);
    border-top: 1px solid var(--border);
    margin-top: 2rem;
    font-family: 'DM Mono', monospace;
  }

  @media (max-width: 600px) {
    header { padding: 0 1.25rem; }
    main { padding: 2rem 1.25rem; }
    .page-title { font-size: 22px; }
    .cards { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-mark">B</div>
    <div class="logo-name">Broadway</div>
    <div class="logo-divider"></div>
    <div class="logo-sub">Internal Tools</div>
  </div>
  <div class="header-right" id="clock"></div>
</header>

<main>
  <h1 class="page-title">Team tools &amp; dashboards</h1>
  <p class="page-sub">Quick access to all Broadway apps. Click any card to open.</p>
  <div id="sections-container"></div>
</main>

<footer>Broadway Live · Hyderabad · Delhi · Pune · Internal use only</footer>

<script>
  function tick() {
    const now = new Date();
    document.getElementById('clock').textContent = now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true }) + ' IST';
  }
  tick();
  setInterval(tick, 1000);

  async function loadLinks() {
    const res = await fetch('/api/links');
    const links = await res.json();

    const grouped = {};
    links.forEach(l => {
      if (!grouped[l.category]) grouped[l.category] = [];
      grouped[l.category].push(l);
    });

    const container = document.getElementById('sections-container');
    container.innerHTML = '';

    if (links.length === 0) {
      container.innerHTML = `<div class="empty-state"><i class="ti ti-tools"></i>No tools added yet. Check back soon.</div>`;
      return;
    }

    Object.entries(grouped).forEach(([cat, items]) => {
      const section = document.createElement('div');
      section.className = 'section';
      section.innerHTML = `<div class="section-label">${cat}</div><div class="cards" id="cat-${cat}"></div>`;
      container.appendChild(section);

      const grid = document.getElementById('cat-' + cat);
      items.forEach(link => {
        const a = document.createElement('a');
        a.className = 'card';
        a.href = link.url;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.innerHTML = `
          <div class="card-icon"><i class="ti ${link.icon || 'ti-link'}" aria-hidden="true"></i></div>
          <div class="card-name">${link.name}</div>
          <div class="card-desc">${link.description || ''}</div>
          <div class="card-footer">
            <span class="card-tag">${cat}</span>
            <i class="ti ti-arrow-up-right card-arrow" aria-hidden="true"></i>
          </div>
        `;
        grid.appendChild(a);
      });
    });
  }

  loadLinks();
</script>
</body>
</html>
